<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Testes do leitor de NFS-e</title>
  <style>
    body { font: 15px/1.5 "Segoe UI", Arial, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; color: #1d2733; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 24px; }
    li { margin: 4px 0; }
    .ok { color: #1d7a4f; }
    .falha { color: #a12828; font-weight: 700; }
    #resumo { padding: 12px 14px; border-radius: 8px; background: #eef2f6; font-weight: 600; }
    code { background: #f2f4f7; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Testes do leitor de NFS-e</h1>
  <p>Autoteste do parser em <code>app.js</code>, com os layouts GINFES encontrados nos XMLs de exemplo. Não precisa de servidor.</p>
  <div id="resumo">Executando...</div>
  <div id="saida"></div>

  <script src="municipios.js"></script>
  <script src="app.js?v=8"></script>
  <script>
    (async function () {
      'use strict';

      var novaProcessada = '<?xml version="1.0" encoding="UTF-8"?>' +
        '<NFSE xmlns="http://www.ginfes.com.br/tipos_v03.xsd"><Nfse><InfNfse>' +
        '<Numero>3635</Numero><DataEmissao>2026-10-14T12:04:26.077-03:00</DataEmissao>' +
        '<ChaveAcesso>CHAVE-3635</ChaveAcesso><SituacaoAdn>Processado com Sucesso</SituacaoAdn>' +
        '<Servico><Valores><ValorServicos>650</ValorServicos><ValorInss>71.5</ValorInss>' +
        '<IssRetido>2</IssRetido><ValorIss>14.17</ValorIss><ValorIssRetido>0</ValorIssRetido>' +
        '<Aliquota>2.18</Aliquota><ValorLiquidoNfse>578.5</ValorLiquidoNfse></Valores>' +
        '<ItemListaServico>713</ItemListaServico><CodigoCnae>812220001</CodigoCnae>' +
        '<CodigoMunicipio>2304400</CodigoMunicipio></Servico>' +
        '<PrestadorServico><IdentificacaoPrestador><Cnpj>03602402000154</Cnpj></IdentificacaoPrestador>' +
        '<RazaoSocial>MARIA RISONEIDE MENDES VELOSO</RazaoSocial></PrestadorServico>' +
        '<TomadorServico><IdentificacaoTomador><CpfCnpj><Cnpj>07221472000466</Cnpj></CpfCnpj></IdentificacaoTomador>' +
        '<RazaoSocial>JAGUAR COMERCIO DE TINTAS LTDA</RazaoSocial>' +
        '<Endereco><CodigoMunicipio>2304400</CodigoMunicipio><Uf>CE</Uf></Endereco></TomadorServico>' +
        '<OrgaoGerador><CodigoMunicipio>2304400</CodigoMunicipio><Uf>CE</Uf></OrgaoGerador>' +
        '</InfNfse></Nfse></NFSE>';

      var cancelada = novaProcessada.replace('CHAVE-3635', 'CHAVE-3633').replace('<Numero>3635</Numero>', '<Numero>3633</Numero>') +
        '<Cancelamento><Confirmacao><InfConfirmacaoCancelamento><Sucesso>true</Sucesso>' +
        '<DataHora>2026-10-14T11:51:19-03:00</DataHora></InfConfirmacaoCancelamento></Confirmacao></Cancelamento>';

      // O bloco Cancelamento precisa ficar dentro do NFSE, por isso refazemos o fechamento.
      cancelada = cancelada.replace('</NFSE><Cancelamento>', '<Cancelamento>').replace('</Cancelamento>', '</Cancelamento></NFSE>');

      var emProcessamento = novaProcessada.replace('CHAVE-3635', 'CHAVE-3637')
        .replace('<Numero>3635</Numero>', '<Numero>3637</Numero>')
        .replace('Processado com Sucesso', 'Em Processamento');

      var layoutAntigo = '<?xml version="1.0" encoding="UTF-8"?>' +
        '<NFSE xmlns="http://www.ginfes.com.br/tipos"><Nfse>' +
        '<IdentificacaoNfse><Numero>42</Numero><CodigoVerificacao>557582668</CodigoVerificacao></IdentificacaoNfse>' +
        '<DataEmissao>2024-07-25T14:21:16.729-03:00</DataEmissao>' +
        '<Servico><Valores><ValorServicos>2604</ValorServicos><IssRetido>2</IssRetido><ValorIss>56.51</ValorIss>' +
        '<BaseCalculo>2604</BaseCalculo><Aliquota>2.17</Aliquota><ValorLiquidoNfse>2604</ValorLiquidoNfse>' +
        '<ValorIssRetido>0</ValorIssRetido></Valores><ItemListaServico>408</ItemListaServico>' +
        '<CodigoTributacaoMunicipio>865000401</CodigoTributacaoMunicipio>' +
        '<MunicipioPrestacaoServico>2304400</MunicipioPrestacaoServico></Servico>' +
        '<PrestadorServico><IdentificacaoPrestador><Cnpj>50469491000192</Cnpj></IdentificacaoPrestador>' +
        '<RazaoSocial>ESP FISIOTERAPIA E SAUDE LTDA</RazaoSocial></PrestadorServico>' +
        '<TomadorServico><IdentificacaoTomador><CpfCnpj><Cpf>00788079301</Cpf></CpfCnpj></IdentificacaoTomador>' +
        '<RazaoSocial>FRANCISCO TARCÍZIO CAVALCANTE</RazaoSocial>' +
        '<Endereco><Cidade>2303709</Cidade><Estado>CE</Estado></Endereco></TomadorServico>' +
        '<OrgaoGerador><CodigoMunicipio>2304400</CodigoMunicipio><Uf>CE</Uf></OrgaoGerador>' +
        '</Nfse></NFSE>';

      var casos = [
        {
          nome: 'Layout novo — processada',
          xml: novaProcessada,
          esperado: {
            numero: '3635', dataIso: '2026-10-14', status: 'processada',
            tomador: 'JAGUAR COMERCIO DE TINTAS LTDA', cpfCnpj: '07221472000466',
            atividade: '812220001', valorServico: 650, valorTotal: 578.5, aliquota: 2.18,
            issRetido: false, inss: 71.5, municipio: 'Fortaleza', municipioUf: 'CE'
          }
        },
        {
          nome: 'Layout novo — cancelada (mesmo com SituacaoAdn processado)',
          xml: cancelada,
          esperado: { numero: '3633', status: 'cancelada' }
        },
        {
          nome: 'Layout novo — em processamento',
          xml: emProcessamento,
          esperado: { numero: '3637', status: 'processamento' }
        },
        {
          nome: 'Layout antigo — sem SituacaoAdn',
          xml: layoutAntigo,
          esperado: {
            numero: '42', dataIso: '2024-07-25', status: 'desconhecida',
            tomador: 'FRANCISCO TARCÍZIO CAVALCANTE', cpfCnpj: '00788079301',
            atividade: '865000401', valorServico: 2604, valorTotal: 2604,
            aliquota: 2.17, issRetido: false, inss: 0, municipio: 'Fortaleza'
          }
        }
      ];

      var saida = document.getElementById('saida');
      var total = 0, falhas = 0;

      function mostrarResultado(nome, problemas) {
        var bloco = document.createElement('div');
        var titulo = document.createElement('h2');
        titulo.className = problemas.length ? 'falha' : 'ok';
        titulo.textContent = (problemas.length ? '✗ ' : '✓ ') + nome;
        bloco.appendChild(titulo);

        if (problemas.length) {
          var ul = document.createElement('ul');
          problemas.forEach(function (p) {
            var li = document.createElement('li');
            li.textContent = p;
            ul.appendChild(li);
          });
          bloco.appendChild(ul);
        }
        saida.appendChild(bloco);
      }

      casos.forEach(function (caso) {
        var nota = NFSe.parseXml(caso.xml, 'teste.xml');
        var problemas = [];
        total++;

        if (nota.erro) {
          problemas.push('erro de leitura: ' + nota.erro);
        } else {
          Object.keys(caso.esperado).forEach(function (campo) {
            if (nota[campo] !== caso.esperado[campo]) {
              problemas.push(campo + ': esperado ' + JSON.stringify(caso.esperado[campo]) + ', obtido ' + JSON.stringify(nota[campo]));
            }
          });
        }

        if (problemas.length) falhas++;
        mostrarResultado(caso.nome, problemas);
      });

      // XML antigo com envelope de assinatura e duas notas no mesmo arquivo.
      var loteAssinado = '<?xml version="1.0" encoding="UTF-8"?>' +
        '<NFSE xmlns="http://www.ginfes.com.br/tipos" xmlns:ns2="http://www.w3.org/2000/09/xmldsig#">' +
        '<ns2:Nfse><Nfse><IdentificacaoNfse><Numero>57887</Numero></IdentificacaoNfse>' +
        '<DataEmissao>2025-04-30T14:37:04-03:00</DataEmissao><Servico><Valores>' +
        '<ValorServicos>100</ValorServicos><ValorLiquidoNfse>100</ValorLiquidoNfse>' +
        '</Valores></Servico></Nfse></ns2:Nfse>' +
        '<ns2:Nfse><Nfse><IdentificacaoNfse><Numero>5371</Numero></IdentificacaoNfse>' +
        '<DataEmissao>2025-04-30T14:37:04-03:00</DataEmissao><Servico><Valores>' +
        '<ValorServicos>200</ValorServicos><ValorLiquidoNfse>200</ValorLiquidoNfse>' +
        '</Valores></Servico></Nfse></ns2:Nfse>' +
        '</NFSE>';

      var lote = NFSe.parseXmls(loteAssinado, 'lote.xml');
      var problemasLote = [];
      total++;
      if (lote.length !== 2) {
        problemasLote.push('esperado 2 notas, obtido ' + lote.length);
      } else {
        if (lote[0].numero !== '57887') problemasLote.push('primeira nota: ' + lote[0].numero);
        if (lote[1].numero !== '5371') problemasLote.push('segunda nota: ' + lote[1].numero);
        if (lote[0].dataIso !== '2025-04-30') problemasLote.push('data da primeira: ' + lote[0].dataIso);
      }
      if (problemasLote.length) falhas++;
      mostrarResultado('XML antigo assinado com 2 notas', problemasLote);

      // A chave do layout antigo não pode depender do tomador.
      function notaAntiga(numero, tomador) {
        return '<?xml version="1.0" encoding="UTF-8"?>' +
          '<NFSE xmlns="http://www.ginfes.com.br/tipos"><Nfse>' +
          '<IdentificacaoNfse><Numero>' + numero + '</Numero></IdentificacaoNfse>' +
          '<DataEmissao>2024-07-25T14:21:16-03:00</DataEmissao>' +
          '<Servico><Valores><ValorServicos>100</ValorServicos>' +
          '<ValorLiquidoNfse>100</ValorLiquidoNfse></Valores></Servico>' +
          '<PrestadorServico><IdentificacaoPrestador><Cnpj>50469491000192</Cnpj>' +
          '</IdentificacaoPrestador></PrestadorServico>' +
          '<TomadorServico><RazaoSocial>' + tomador + '</RazaoSocial></TomadorServico>' +
          '</Nfse></NFSE>';
      }

      var chaveA = NFSe.parseXml(notaAntiga('42', 'EMPRESA A'), 'a.xml').chave;
      var chaveB = NFSe.parseXml(notaAntiga('42', 'EMPRESA B'), 'b.xml').chave;
      var problemasChave = [];
      total++;
      if (chaveA !== chaveB) problemasChave.push('chaves diferentes: ' + chaveA + ' / ' + chaveB);
      if (problemasChave.length) falhas++;
      mostrarResultado('Chave de duplicidade sem o tomador', problemasChave);

      // A versão de maior prioridade fica na lista.
      function notaSimples(status) {
        return { id: 'id-' + status, chave: 'k1', numero: '1', status: status };
      }
      var lista = [], mapa = {};
      var processada = notaSimples('processada');
      var nova = NFSe.mesclar(lista, mapa, processada);
      var canceladaSimples = notaSimples('cancelada');
      var venceu = NFSe.mesclar(lista, mapa, canceladaSimples);
      var perdeu = NFSe.mesclar(lista, mapa, notaSimples('processada'));
      var problemasMescla = [];
      total++;
      if (nova !== null) problemasMescla.push('nota nova deveria retornar null');
      if (lista.length !== 1) problemasMescla.push('lista deveria ter 1 nota, tem ' + lista.length);
      if (venceu !== canceladaSimples) problemasMescla.push('cancelada deveria substituir a processada');
      if (canceladaSimples.id !== processada.id) problemasMescla.push('id da versão mantida mudou');
      if (perdeu !== canceladaSimples) problemasMescla.push('processada não deveria substituir a cancelada');
      if (lista[0] !== canceladaSimples) problemasMescla.push('lista deveria manter a cancelada');
      if (problemasMescla.length) falhas++;
      mostrarResultado('Prioridade entre versões duplicadas', problemasMescla);

      // CSV não pode começar célula com fórmula.
      var problemasCsv = [];
      total++;
      if (NFSe.campoCsv('=1+1') !== "'=1+1") problemasCsv.push('fórmula não foi neutralizada: ' + NFSe.campoCsv('=1+1'));
      if (NFSe.campoCsv('a;b') !== '"a;b"') problemasCsv.push('ponto e vírgula não foi citado');
      if (NFSe.campoCsv('a"b') !== '"a""b"') problemasCsv.push('aspas não foram duplicadas');
      if (problemasCsv.length) falhas++;
      mostrarResultado('CSV seguro contra fórmulas', problemasCsv);

      // Zero é um valor válido, não campo ausente.
      var zero = NFSe.parseXml('<?xml version="1.0" encoding="UTF-8"?>' +
        '<NFSE xmlns="http://www.ginfes.com.br/tipos_v03.xsd"><Nfse><InfNfse>' +
        '<Numero>1</Numero><DataEmissao>2026-01-01T10:00:00-03:00</DataEmissao>' +
        '<Servico><Valores><ValorServicos>100</ValorServicos><ValorLiquidoNfse>0</ValorLiquidoNfse>' +
        '<IssRetido>1</IssRetido><ValorIss>10</ValorIss><ValorIssRetido>0</ValorIssRetido>' +
        '</Valores></Servico></InfNfse></Nfse></NFSE>', 'zero.xml');
      var problemasZero = [];
      total++;
      if (zero.valorTotal !== 0) problemasZero.push('valorTotal: esperado 0, obtido ' + zero.valorTotal);
      if (zero.valorIssRetido !== 0) problemasZero.push('valorIssRetido: esperado 0, obtido ' + zero.valorIssRetido);
      if (zero.valorIss !== 10) problemasZero.push('valorIss: esperado 10, obtido ' + zero.valorIss);
      if (problemasZero.length) falhas++;
      mostrarResultado('Zero não é campo ausente', problemasZero);

      // XML em UTF-16LE com BOM.
      var textoUtf16 = '<?xml version="1.0" encoding="UTF-16"?><NFSE><Nfse><InfNfse><Numero>7</Numero></InfNfse></Nfse></NFSE>';
      var bytesUtf16 = new Uint8Array(2 + textoUtf16.length * 2);
      bytesUtf16[0] = 0xFF;
      bytesUtf16[1] = 0xFE;
      for (var bi = 0; bi < textoUtf16.length; bi++) {
        var cc = textoUtf16.charCodeAt(bi);
        bytesUtf16[2 + bi * 2] = cc & 0xFF;
        bytesUtf16[3 + bi * 2] = cc >> 8;
      }
      var lidoUtf16 = await NFSe.lerConteudo(new File([bytesUtf16], 'utf16.xml'));
      var problemasUtf16 = [];
      total++;
      if (lidoUtf16.indexOf('<NFSE') === -1) problemasUtf16.push('UTF-16 não foi decodificado');
      if (problemasUtf16.length) falhas++;
      mostrarResultado('XML em UTF-16', problemasUtf16);

      // Layout nacional do Portal Contribuinte (sped.fazenda.gov.br/nfse).
      var nacionalRetido = '<?xml version="1.0" encoding="utf-8"?>' +
        '<NFSe versao="1.01" xmlns="http://www.sped.fazenda.gov.br/nfse">' +
        '<infNFSe Id="NFS23044002203602402000154000000000000526110179263187">' +
        '<nNFSe>5</nNFSe><cStat>100</cStat><dhProc>2026-11-07T12:36:30-03:00</dhProc>' +
        '<emit><CNPJ>03602402000154</CNPJ><xNome>MARIA RISONEIDE MENDES VELOSO</xNome>' +
        '<enderNac><cMun>2304400</cMun><UF>CE</UF></enderNac></emit>' +
        '<valores><vBC>410.00</vBC><pAliqAplic>2.18</pAliqAplic><vISSQN>8.94</vISSQN>' +
        '<vTotalRet>8.94</vTotalRet><vLiq>401.06</vLiq></valores>' +
        '<DPS versao="1.01" xmlns="http://www.sped.fazenda.gov.br/nfse"><infDPS>' +
        '<dhEmi>2026-11-07T12:36:30-03:00</dhEmi>' +
        '<prest><CNPJ>03602402000154</CNPJ></prest>' +
        '<toma><CNPJ>03837881000198</CNPJ><xNome>STAR LOGISTICA INTERNACIONAL LTDA</xNome></toma>' +
        '<serv><locPrest><cLocPrestacao>2304400</cLocPrestacao></locPrest>' +
        '<cServ><cTribNac>071301</cTribNac><cTribMun>003</cTribMun>' +
        '<xDescServ>DEDETIZACAO</xDescServ></cServ></serv>' +
        '<valores><vServPrest><vServ>410.00</vServ></vServPrest>' +
        '<trib><tribMun><tribISSQN>1</tribISSQN><tpRetISSQN>2</tpRetISSQN><pAliq>2.18</pAliq></tribMun>' +
        '<tribFed><piscofins><CST>00</CST></piscofins></tribFed></trib></valores>' +
        '</infDPS></DPS></infNFSe></NFSe>';

      var notaNacional = NFSe.parseXml(nacionalRetido, 'nacional.xml');
      var problemasNacional = [];
      total++;
      if (notaNacional.erro) {
        problemasNacional.push('erro de leitura: ' + notaNacional.erro);
      } else {
        var esperadoNacional = {
          numero: '5', dataIso: '2026-11-07', status: 'processada',
          tomador: 'STAR LOGISTICA INTERNACIONAL LTDA', cpfCnpj: '03837881000198',
          atividade: '071301', valorServico: 410, valorTotal: 401.06, aliquota: 2.18,
          issRetido: true, valorIss: 8.94, valorIssRetido: 8.94, inss: 0,
          municipio: 'Fortaleza', municipioUf: 'CE',
          prestador: 'MARIA RISONEIDE MENDES VELOSO'
        };
        Object.keys(esperadoNacional).forEach(function (campo) {
          if (notaNacional[campo] !== esperadoNacional[campo]) {
            problemasNacional.push(campo + ': esperado ' + JSON.stringify(esperadoNacional[campo]) + ', obtido ' + JSON.stringify(notaNacional[campo]));
          }
        });
      }
      if (problemasNacional.length) falhas++;
      mostrarResultado('Layout nacional — ISS retido', problemasNacional);

      // Nota nacional sem retenção e sem vISSQN.
      var nacionalSimples = nacionalRetido
        .replace('<nNFSe>5</nNFSe>', '<nNFSe>1</nNFSe>')
        .replace('<vISSQN>8.94</vISSQN><vTotalRet>8.94</vTotalRet>', '')
        .replace('<vLiq>401.06</vLiq>', '<vLiq>400.00</vLiq>')
        .replace('<tpRetISSQN>2</tpRetISSQN>', '<tpRetISSQN>1</tpRetISSQN>')
        .replace('<vServ>410.00</vServ>', '<vServ>400.00</vServ>')
        .replace('<vBC>410.00</vBC>', '<vBC>400.00</vBC>')
        .replace('<pAliqAplic>2.18</pAliqAplic>', '')
        .replace('<pAliq>2.18</pAliq>', '');
      var notaSimplesNacional = NFSe.parseXml(nacionalSimples, 'nacional2.xml');
      var problemasSimples = [];
      total++;
      if (notaSimplesNacional.erro) {
        problemasSimples.push('erro de leitura: ' + notaSimplesNacional.erro);
      } else {
        if (notaSimplesNacional.issRetido !== false) problemasSimples.push('issRetido: ' + notaSimplesNacional.issRetido);
        if (notaSimplesNacional.valorIssRetido !== null) problemasSimples.push('valorIssRetido: ' + notaSimplesNacional.valorIssRetido);
        if (notaSimplesNacional.valorIss !== 0) problemasSimples.push('valorIss: ' + notaSimplesNacional.valorIss);
        if (notaSimplesNacional.valorTotal !== 400) problemasSimples.push('valorTotal: ' + notaSimplesNacional.valorTotal);
      }
      if (problemasSimples.length) falhas++;
      mostrarResultado('Layout nacional — sem retenção', problemasSimples);

      // A chave do layout nacional usa o Id da NFS-e.
      var chaveNacional = NFSe.parseXml(nacionalRetido, 'a.xml').chave;
      var chaveNacionalB = NFSe.parseXml(nacionalRetido, 'b.xml').chave;
      var problemasChaveNacional = [];
      total++;
      if (chaveNacional !== 'NFS23044002203602402000154000000000000526110179263187') {
        problemasChaveNacional.push('chave inesperada: ' + chaveNacional);
      }
      if (chaveNacional !== chaveNacionalB) problemasChaveNacional.push('mesma nota gerou chaves diferentes');
      if (problemasChaveNacional.length) falhas++;
      mostrarResultado('Layout nacional — chave pelo Id', problemasChaveNacional);

      // Tags fiscais do leiaute nacional (NT 009 / DPS em produção).
      var nacionalFiscal = '<?xml version="1.0" encoding="utf-8"?>' +
        '<NFSe versao="1.01" xmlns="http://www.sped.fazenda.gov.br/nfse">' +
        '<infNFSe Id="NFS23044002203602402000154000000000000926110000000001">' +
        '<nNFSe>9</nNFSe><cStat>100</cStat><dhProc>2026-11-07T12:36:30-03:00</dhProc>' +
        '<emit><CNPJ>03602402000154</CNPJ><xNome>PRESTADOR TESTE</xNome>' +
        '<enderNac><cMun>2304400</cMun><UF>CE</UF></enderNac></emit>' +
        '<valores><vBC>400.00</vBC><pAliqAplic>2.18</pAliqAplic><vISSQN>8.72</vISSQN>' +
        '<vTotalRet>8.72</vTotalRet><vLiq>391.28</vLiq></valores>' +
        '<DPS versao="1.01" xmlns="http://www.sped.fazenda.gov.br/nfse"><infDPS>' +
        '<dhEmi>2026-11-07T12:36:30-03:00</dhEmi>' +
        '<prest><CNPJ>03602402000154</CNPJ><regTrib>' +
        '<opSimpNac>3</opSimpNac><regApTribSN>1</regApTribSN><regEspTrib>0</regEspTrib>' +
        '</regTrib></prest>' +
        '<toma><CNPJ>03837881000198</CNPJ><xNome>TOMADOR TESTE</xNome></toma>' +
        '<serv><locPrest><cLocPrestacao>2304400</cLocPrestacao></locPrest>' +
        '<cServ><cTribNac>071301</cTribNac><cTribMun>003</cTribMun>' +
        '<xDescServ>DEDETIZACAO</xDescServ></cServ></serv>' +
        '<valores><vServPrest><vServ>400.00</vServ></vServPrest>' +
        '<trib><tribMun><tribISSQN>1</tribISSQN><tpRetISSQN>2</tpRetISSQN><pAliq>2.18</pAliq></tribMun>' +
        '<tribFed><piscofins><CST>01</CST><tpRetPisCofins>2</tpRetPisCofins>' +
        '<pAliqPis>0.65</pAliqPis><pAliqCofins>3.00</pAliqCofins>' +
        '<vBCPisCofins>400.00</vBCPisCofins><vPis>2.60</vPis><vCofins>12.00</vCofins>' +
        '</piscofins></tribFed>' +
        '<totTrib><indTotTrib>0</indTotTrib><pTotTribSN>9.00</pTotTribSN>' +
        '<vTotTrib>45.00</vTotTrib></totTrib></trib>' +
        '<vDedRed><documentos><docDedRed><NFNFS>' +
        '<modNFS>000000000000055</modNFS>' +
        '</NFNFS></docDedRed></documentos></vDedRed>' +
        '</valores></infDPS></DPS></infNFSe></NFSe>';

      var notaFiscal = NFSe.parseXml(nacionalFiscal, 'fiscal.xml');
      var problemasFiscal = [];
      total++;
      if (notaFiscal.erro) {
        problemasFiscal.push('erro de leitura: ' + notaFiscal.erro);
      } else {
        var esperadoFiscal = {
          opSimpNac: '3', regApTribSN: '1', regEspTrib: '0',
          pTotTribSN: 9, indTotTrib: '0', vTotTrib: 45,
          cstPisCofins: '01', tpRetPisCofins: '2',
          pAliqPis: 0.65, pAliqCofins: 3, vBCPisCofins: 400,
          vPis: 2.6, vCofins: 12, pAliq: 2.18, pAliqAplic: 2.18,
          modNFS: '000000000000055'
        };
        Object.keys(esperadoFiscal).forEach(function (campo) {
          if (notaFiscal[campo] !== esperadoFiscal[campo]) {
            problemasFiscal.push(campo + ': esperado ' + JSON.stringify(esperadoFiscal[campo]) + ', obtido ' + JSON.stringify(notaFiscal[campo]));
          }
        });
      }
      if (problemasFiscal.length) falhas++;
      mostrarResultado('Layout nacional — tags fiscais', problemasFiscal);

      // Nota nacional sem os grupos fiscais não deve inventar valores.
      var nacionalSemFiscal = nacionalRetido
        .replace('<tribFed><piscofins><CST>00</CST></piscofins></tribFed>', '');
      var notaSemFiscal = NFSe.parseXml(nacionalSemFiscal, 'sem-fiscal.xml');
      var problemasSemFiscal = [];
      total++;
      if (notaSemFiscal.erro) {
        problemasSemFiscal.push('erro de leitura: ' + notaSemFiscal.erro);
      } else {
        if (notaSemFiscal.opSimpNac !== '') problemasSemFiscal.push('opSimpNac: ' + notaSemFiscal.opSimpNac);
        if (notaSemFiscal.pTotTribSN !== null) problemasSemFiscal.push('pTotTribSN: ' + notaSemFiscal.pTotTribSN);
        if (notaSemFiscal.vTotTrib !== null) problemasSemFiscal.push('vTotTrib: ' + notaSemFiscal.vTotTrib);
        if (notaSemFiscal.cstPisCofins !== '') problemasSemFiscal.push('cstPisCofins: ' + notaSemFiscal.cstPisCofins);
        if (notaSemFiscal.pAliqPis !== null) problemasSemFiscal.push('pAliqPis: ' + notaSemFiscal.pAliqPis);
        if (notaSemFiscal.modNFS !== '') problemasSemFiscal.push('modNFS: ' + notaSemFiscal.modNFS);
      }
      if (problemasSemFiscal.length) falhas++;
      mostrarResultado('Layout nacional — sem tags fiscais', problemasSemFiscal);

      // GINFES: NfseSubstituida aponta o número da nota substituída.
      // A nota antiga costuma vir com bloco de cancelamento no XML.
      var notaSubstituida = cancelada
        .replace('CHAVE-3633', 'CHAVE-3587')
        .replace('<Numero>3633</Numero>', '<Numero>3587</Numero>');
      var notaSubstituta = novaProcessada
        .replace('CHAVE-3635', 'CHAVE-3591')
        .replace('<Numero>3635</Numero>', '<Numero>3591</Numero>')
        .replace('<SituacaoAdn>', '<NfseSubstituida>3587</NfseSubstituida><SituacaoAdn>');
      var antiga = NFSe.parseXml(notaSubstituida, 'antiga.xml');
      var substituta = NFSe.parseXml(notaSubstituta, 'substituta.xml');
      NFSe.marcarSubstituidas([antiga, substituta]);
      var problemasSubstituida = [];
      total++;
      if (substituta.substituiNumero !== '3587') problemasSubstituida.push('substituiNumero: ' + substituta.substituiNumero);
      if (antiga.status !== 'cancelada') problemasSubstituida.push('nota antiga deveria estar cancelada no XML: ' + antiga.status);
      if (antiga.substituida !== true) problemasSubstituida.push('nota antiga deveria estar substituída');
      if (substituta.substituida !== false) problemasSubstituida.push('nota substituta não pode estar substituída');
      if (NFSe.situacao(antiga) !== 'substituida') problemasSubstituida.push('situação da antiga: ' + NFSe.situacao(antiga));
      if (NFSe.situacao(substituta) !== 'processada') problemasSubstituida.push('situação da substituta: ' + NFSe.situacao(substituta));
      if (problemasSubstituida.length) falhas++;
      mostrarResultado('GINFES — nota substituída', problemasSubstituida);

      // Layout nacional: chSubstda aponta a chave da nota substituída.
      var nacionalAntiga = nacionalRetido;
      var nacionalSubstituta = nacionalRetido
        .replace('NFS23044002203602402000154000000000000526110179263187', 'NFS23044002203602402000154000000000000626118720582790')
        .replace('<nNFSe>5</nNFSe>', '<nNFSe>6</nNFSe>')
        .replace('<cStat>100</cStat>', '<cStat>101</cStat>')
        .replace('<dhEmi>', '<subst><chSubstda>23044002203602402000154000000000000526110179263187</chSubstda></subst><dhEmi>');
      var antigaNacional = NFSe.parseXml(nacionalAntiga, 'nacional-antiga.xml');
      var substitutaNacional = NFSe.parseXml(nacionalSubstituta, 'nacional-substituta.xml');
      NFSe.marcarSubstituidas([antigaNacional, substitutaNacional]);
      var problemasSubstituidaNacional = [];
      total++;
      if (substitutaNacional.substituiChave !== '23044002203602402000154000000000000526110179263187') {
        problemasSubstituidaNacional.push('substituiChave: ' + substitutaNacional.substituiChave);
      }
      if (antigaNacional.substituida !== true) problemasSubstituidaNacional.push('nota antiga deveria estar substituída');
      if (substitutaNacional.substituida !== false) problemasSubstituidaNacional.push('nota substituta não pode estar substituída');
      if (NFSe.situacao(antigaNacional) !== 'substituida') problemasSubstituidaNacional.push('situação da antiga: ' + NFSe.situacao(antigaNacional));
      if (problemasSubstituidaNacional.length) falhas++;
      mostrarResultado('Layout nacional — nota substituída', problemasSubstituidaNacional);

      // O XML da nota antiga pode vir cancelado; a substituição tem prioridade.
      total++;
      if (NFSe.situacao(antiga) !== 'substituida') {
        falhas++;
        mostrarResultado('Substituída tem prioridade sobre cancelada', ['situação: ' + NFSe.situacao(antiga)]);
      } else {
        mostrarResultado('Substituída tem prioridade sobre cancelada', []);
      }

      var arquivoInvalido = NFSe.parseXml('<html></html>', 'x.xml');
      total++;
      if (!arquivoInvalido.erro) falhas++;

      document.getElementById('resumo').textContent = falhas
        ? falhas + ' de ' + total + ' verificação(ões) com falha'
        : 'Todos os ' + total + ' casos passaram';
      document.getElementById('resumo').className = falhas ? 'falha' : 'ok';
    })();
  </script>
</body>
</html>
